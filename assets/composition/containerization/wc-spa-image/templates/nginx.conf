# Serves the built SPA with the history-API fallback, from the
# shared assets volume the init container populates. Mounted
# read-only into an unmodified official nginx image — the server
# never rebuilds; releases replace the assets image. Gateway
# concerns — proxying /api to a backend — belong to whatever fronts
# this container (compose, an ingress, a platform router).
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }
}
