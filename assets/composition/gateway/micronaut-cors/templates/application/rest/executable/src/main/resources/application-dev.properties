# Loaded only when the `dev` environment is active
# (MICRONAUT_ENVIRONMENTS=dev): allows the sibling SPA (Vite dev
# server) to call this API directly during development. Never active
# in production, where SPA traffic arrives same-origin through the
# reverse proxy.
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.ui.allowed-origins=http://localhost:5173
