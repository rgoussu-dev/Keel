# Production posture (activate with MICRONAUT_ENVIRONMENTS=prod):
# datasource config is environment-only — the service fails fast when
# DB_URL is unset — and migrations never run in-process; the isolated
# runner (migrations/ — its own container) owns the schema.
datasources.default.url=${DB_URL}
datasources.default.username=${DB_USERNAME}
datasources.default.password=${DB_PASSWORD}
flyway.datasources.default.enabled=false
