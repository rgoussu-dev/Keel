# Production posture (activate with SPRING_PROFILES_ACTIVE=prod):
# datasource config is environment-only — the service fails fast when
# DB_URL is unset — and migrations never run in-process; the isolated
# runner (migrations/ — its own container) owns the schema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=false
