apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      volumes:
        - name: spa-assets
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ .Chart.Name }}-nginx
      # The assets image populates the shared volume before nginx
      # starts: clear-then-copy, then env.js from the environment —
      # one bundle, every environment.
      initContainers:
        - name: spa-assets
          image: '{{ required "set image.repository to the assets image the release pipeline pushed" .Values.image.repository }}:{{ required "set image.tag" .Values.image.tag }}'
          env:
            - name: API_BASE_URL
              value: {{ .Values.apiBaseUrl | quote }}
          volumeMounts:
            - name: spa-assets
              mountPath: /assets
      containers:
        - name: web
          image: {{ .Values.nginx.image | quote }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: spa-assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
