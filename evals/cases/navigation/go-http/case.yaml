# Lane A navigation probe — agent-neutral: nothing agent-specific
# appears here; drivers map budgets/autonomy to their own CLI.
id: navigation/go-http
tags:
  - navigation
  - go
scaffold:
  stack: go-http
  module_layout: modulith
  answers:
    walking-skeleton/go-bootstrap:
      modulePath: example.com/nav-eval
      projectName: nav-eval
  grow:
    - module: ordering
      consumes: greeting
    - module: shipping
      consumes: ordering
    - module: billing
    - vertical: persistence
prompt: |
  You are in a keel-scaffolded project. Answer three orientation
  questions about THIS repository. Do not modify any project file.

  1. wiring — which single file wires the `shipping` bounded context's
     handler into the application's composition root (the file that
     registers it with the application entrypoint's mediator)?
  2. gateway — which single file implements the gateway through which
     the `shipping` context reaches the `ordering` context's service
     seam?
  3. migration — which single SQL migration file creates the greeting
     table?

  Write your answers to the file `.keel-eval/answers.txt` (create the
  directory if it does not exist), one per line, exactly as:

  wiring=<repository-relative path>
  gateway=<repository-relative path>
  migration=<repository-relative path>

  Use forward slashes and paths relative to the repository root. Write
  nothing else anywhere in the repository.
oracle:
  answers_file: .keel-eval/answers.txt
  answers:
    wiring: cmd/http/shipping.go
    gateway: internal/modules/shipping/infra/orderinggateway/gateway.go
    migration: migrations/sql/V1__create_greeting.sql
  clean_worktree: true
budgets:
  timeout_seconds: 600
  max_turns: 30
runs: 3
