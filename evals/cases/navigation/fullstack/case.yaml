# Lane A navigation probe — agent-neutral: nothing agent-specific
# appears here; drivers map budgets/autonomy to their own CLI.
#
# The only probe whose workspace is a **product root** (#142). Every
# other case starts inside one project; this one starts above two,
# where nothing auto-loads and the answers live on the far side of a
# service boundary. All three questions cross that boundary on
# purpose — the root's `keel:map` is the only thing at the starting
# point that says the services exist or which is which.
id: navigation/fullstack
tags:
  - navigation
  - composite
scaffold:
  stack: fullstack
prompt: |
  You are at the root of a keel-scaffolded workspace. Answer three
  orientation questions about THIS repository. Do not modify any
  project file.

  1. gateway — which single file implements the frontend's outbound
     call to the backend's REST API (the adapter, not the port it
     implements and not its fake)?
  2. cors — which single file carries the backend's configuration
     allowing the frontend's browser origin to call it?
  3. contract — which single file pins the wire contract the two
     services agree on?

  Write your answers to the file `.keel-eval/answers.txt` (create the
  directory if it does not exist), one per line, exactly as:

  gateway=<repository-relative path>
  cors=<repository-relative path>
  contract=<repository-relative path>

  Use forward slashes and paths relative to the repository root — the
  workspace root, not a service directory. Write nothing else
  anywhere in the repository.
oracle:
  answers_file: .keel-eval/answers.txt
  answers:
    gateway: frontend/infrastructure/gateway-rest/src/rest-greet-gateway.ts
    cors: backend/application/rest/executable/src/main/resources/application.properties
    contract: backend/contract/greet.openapi.yaml
  clean_worktree: true
budgets:
  timeout_seconds: 600
  max_turns: 30
runs: 3
