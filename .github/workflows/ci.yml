name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The other half of the suite. `verify` runs the whole of `vitest run`,
  # but tests/e2e/ self-skips on CI unless KEEL_RUN_E2E=1 — those suites
  # scaffold a real project, build it with its own wrapper, boot it and
  # drive it over the wire, so they need every toolchain keel emits for
  # and take tens of minutes. Splitting them off keeps the fast gate fast
  # while still running them on every PR; between the two jobs, nothing
  # in the suite is skipped for want of a tool.
  #
  # Sharded by toolchain, one job per stack family. Two reasons, and
  # neither is wall clock alone:
  #
  #   - A shard installs only what its suites probe for. The Go, Rust
  #     and web shards skip the JDK + Gradle + Maven provisioning
  #     entirely, which is the slowest setup here.
  #   - A red X reads `e2e (go)` instead of `e2e`, and re-running one
  #     stack does not re-run the JVM builds.
  #
  # The JVM is then sharded again, along the grid its suites populate,
  # and the two typologies are shaped differently because their volumes
  # are. `basic` is twelve files and stays split by framework, four
  # apiece — CLI and REST × Java and Kotlin — so a red X names the
  # container whose wiring broke and the failing test inside it names
  # the language and the shape. `modulith` is twenty-five and splits by
  # framework × **language**, four apiece (six on Quarkus, which also
  # carries the two non-cell variants).
  #
  # Language is a legal axis here for the first time, and it is the
  # grid rather than an argument that made it one: a shard that runs
  # nothing is worse than no shard, because the check name asserts
  # coverage that does not exist — and until the modulith's Kotlin
  # cells were populated, `jvm-modulith-*-kotlin` would have been
  # exactly that. It is not an axis on the `basic` half, because there
  # a language split buys attribution and no wall clock: those shards
  # already sit near their longest-file floor, and each extra shard
  # costs a fresh JDK + Gradle provisioning.
  #
  # The `files` list is the shard's whole definition, and it is load
  # bearing: a suite in no shard never runs, which looks exactly like a
  # suite that passed. `tests/ci-workflow.test.ts` parses this file and
  # fails in `verify` when tests/e2e/ and these lists disagree — that
  # test is the only thing standing between a new suite and silent
  # non-coverage, so do not delete it when editing the matrix.
  #
  # Vitest parallelises across files but runs the tests inside one file
  # in sequence, so the slowest single *file* is a shard's floor. Four
  # concurrent JVM builds on a 4-vCPU runner do not get 4× though —
  # measured across the six modulith shards the divisor is 2.22–2.45,
  # because each Gradle build is itself parallel and they contend.
  # Both numbers move when suites are added; re-measure before
  # rebalancing, and measure on the shard shape actually shipped, since
  # a file timed against 16 neighbours is far slower than the same file
  # timed against three.
  #
  # For scale: the commit before this split ran all 25 modulith files
  # as one job and took 1475s on a runner, against a slowest shard of
  # 415s here — the split is worth ~3.5x, not attribution alone.
  #
  # The floor is why this split stops here rather than going finer.
  # `jvm-modulith-micronaut-kotlin` runs 252s against a 249s longest
  # file: it is already floor-bound, so halving it again would buy
  # attribution and nothing else. `jvm-modulith-quarkus-java` is the
  # one with headroom left (415s against a 260s floor) and is the place
  # to split first if it grows.
  e2e:
    name: e2e (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEEL_RUN_E2E: '1'

    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: jvm-basic-quarkus
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton.test.ts
              tests/e2e/walking-skeleton-quarkus-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-rest.test.ts
              tests/e2e/walking-skeleton-kotlin.test.ts
          - id: jvm-basic-spring
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton-spring-cli.test.ts
              tests/e2e/walking-skeleton-spring-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-spring.test.ts
              tests/e2e/walking-skeleton-spring-kotlin.test.ts
          - id: jvm-basic-micronaut
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton-micronaut-cli.test.ts
              tests/e2e/walking-skeleton-micronaut-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-micronaut.test.ts
              tests/e2e/walking-skeleton-micronaut-kotlin.test.ts
          - id: jvm-modulith-quarkus-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-quarkus-rest-gradle.test.ts
              tests/e2e/modulith-quarkus-rest-maven.test.ts
              tests/e2e/modulith-quarkus-cli-gradle.test.ts
              tests/e2e/modulith-quarkus-cli-maven.test.ts
              tests/e2e/modulith-baseline.test.ts
              tests/e2e/modulith-persistence.test.ts
          - id: jvm-modulith-quarkus-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-quarkus-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-quarkus-rest-kotlin-maven.test.ts
              tests/e2e/modulith-quarkus-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-quarkus-cli-kotlin-maven.test.ts
          - id: jvm-modulith-spring-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-spring-rest-gradle.test.ts
              tests/e2e/modulith-spring-rest-maven.test.ts
              tests/e2e/modulith-spring-cli-gradle.test.ts
              tests/e2e/modulith-spring-cli-maven.test.ts
          - id: jvm-modulith-spring-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-spring-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-spring-rest-kotlin-maven.test.ts
              tests/e2e/modulith-spring-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-spring-cli-kotlin-maven.test.ts
          - id: jvm-modulith-micronaut-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-micronaut-rest-gradle.test.ts
              tests/e2e/modulith-micronaut-rest-maven.test.ts
              tests/e2e/modulith-micronaut-cli-gradle.test.ts
              tests/e2e/modulith-micronaut-cli-maven.test.ts
          - id: jvm-modulith-micronaut-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-micronaut-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-micronaut-rest-kotlin-maven.test.ts
              tests/e2e/modulith-micronaut-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-micronaut-cli-kotlin-maven.test.ts
          # Six files where there were two, and the split is the
          # modulith grid arriving rather than a rebalance. Measured
          # locally on the shipped shape: the whole shard is ~55s of
          # test time, longest single file `walking-skeleton-go.test.ts`
          # at 42.8s (its `go-http` case pays the cold OpenTelemetry
          # fetch), against `modulith-go-http` 15.5s,
          # `modulith-go-cli` 14.4s and `modulith-go-peer-context`
          # 14.4s. Nothing new is near the floor, so this stays one
          # shard: splitting would buy attribution and no wall clock,
          # and `docker` is still here for `fullstack-go` alone.
          - id: go
            tools: go docker
            files: >-
              tests/e2e/walking-skeleton-go.test.ts
              tests/e2e/modulith-go-cli.test.ts
              tests/e2e/modulith-go-http.test.ts
              tests/e2e/modulith-go-peer-context.test.ts
              tests/e2e/fullstack-go.test.ts
          # Six files, one shard — and unlike every earlier revision of
          # this comment, that is now a choice with a cost rather than
          # a free one. Measured on this runner when the persistence
          # cell landed: 427.14s of test time in 180.08s wall, divisor
          # 2.37, longest single file 178.88s. The wall *is* that file.
          # The five older files sum to 248.27s with a longest of
          # 91.97s, which is the ~98s floor this job used to sit at.
          #
          # So the standing argument no longer applies as written. The
          # old shape was floor-bound by files that all paid the same
          # cold axum compile, which is why splitting bought
          # attribution and nothing else. `modulith-rust-persistence`
          # pays a cold `postgres` compile on top of that one and is
          # nearly twice the next-slowest file, so peeling it out would
          # cut real wall clock rather than relabel it.
          #
          # How much is not measured, and the honest bound matters:
          # 178.88s is the *contended* cost — it shared four cores with
          # five other files for its first ~92s. Run alone it would be
          # faster (locally, 98.99s alone against 195.29s contended),
          # so a split plausibly lands this job near ~120s rather than
          # at the ~90s the arithmetic of "max of the two halves"
          # suggests. Kept as one shard until someone measures the
          # uncontended number instead of estimating it; that is the
          # one figure the decision still turns on.
          #
          # `tools:` stays `cargo`, and the persistence cell is why
          # that is worth stating: its contract test wants a Postgres
          # through Testcontainers and gets none here. The emitted test
          # probes for a daemon and returns early, so `cargo test`
          # still compiles every crate — which is what the cell exists
          # to prove — and skips one case. Adding `docker` here would
          # buy that one assertion and a container pull per run. The
          # JVM's `modulith-persistence` makes the same trade in a
          # shard with no `docker` either.
          - id: rust
            tools: cargo
            files: >-
              tests/e2e/walking-skeleton-rust.test.ts
              tests/e2e/fullstack-rust.test.ts
              tests/e2e/modulith-rust-cli.test.ts
              tests/e2e/modulith-rust-http.test.ts
              tests/e2e/modulith-rust-peer-context.test.ts
              tests/e2e/modulith-rust-persistence.test.ts
          # Nine files where there were three. The modulith halves of
          # the two TypeScript stacks used to ride inside their
          # `walking-skeleton-*` files; they are cells, so they are
          # files now, and `modulith-web-components-pnpm` is a cell
          # that had never been built at all.
          #
          # Measured locally on the shipped shape: every file here
          # sits between 17s and 48s, longest
          # `modulith-wc-peer-context` at 47.9s — it installs three
          # workspaces and renders two of them in Chromium. The old
          # `wc-walking-skeleton.test.ts` ran the basic case *and*
          # both modulith cases in sequence, so peeling those out cut
          # this shard's floor rather than raising it. One shard, and
          # `browser` stays in `tools:` because two suites now render.
          - id: web
            tools: npm pnpm browser
            files: >-
              tests/e2e/ts-walking-skeleton.test.ts
              tests/e2e/modulith-ts-http-npm.test.ts
              tests/e2e/modulith-ts-http-pnpm.test.ts
              tests/e2e/modulith-ts-peer-context.test.ts
              tests/e2e/wc-walking-skeleton.test.ts
              tests/e2e/modulith-web-components-npm.test.ts
              tests/e2e/modulith-web-components-pnpm.test.ts
              tests/e2e/modulith-wc-peer-context.test.ts
              tests/e2e/fullstack.test.ts

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      # JDK 25 because the emitted JVM projects target release 25 and
      # Maven compiles with whatever JDK runs it — on anything older the
      # Maven suites skip themselves rather than fail. Gradle would not
      # care (its foojay resolver provisions a toolchain), which is why
      # this is the JDK the *Maven* half dictates.
      #
      # Every `jvm-*` shard gets it, not only the one holding the Maven
      # suite: the prefix is the whole condition, so a new JVM shard is
      # provisioned by being named, and one that is not named simply
      # skips every suite it was given.
      - name: Setup JDK 25
        if: startsWith(matrix.shard.id, 'jvm')
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # …and that JDK is exactly why the host Gradle has to be pinned.
      # `gradle wrapper` is the only thing it runs (the wrapper it writes
      # is 9.4.1 and provisions its own toolchain), but Gradle 8.x cannot
      # start on JDK 25 — it fails with the version string as the whole
      # error message. Pinning the host to the same 9.4.1 keeps one JDK
      # serving both build systems.
      - name: Setup Gradle 9.4.1
        if: startsWith(matrix.shard.id, 'jvm')
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          gradle-version: '9.4.1'

      # `stable`, not the `go 1.24` the emitted go.mod declares — that
      # directive does not survive first contact. The OpenTelemetry
      # modules the observability vertical pulls in require Go >= 1.25,
      # so the bootstrap's own `go mod tidy` rewrites the line to
      # `go 1.25.0`. On a developer's machine that is invisible
      # (GOTOOLCHAIN defaults to `auto` and Go fetches the newer
      # toolchain); setup-go pins GOTOOLCHAIN=local, so a runner on 1.24
      # cannot upgrade and the scaffold fails outright.
      - name: Setup Go
        if: matrix.shard.id == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Every suite skips itself when its toolchain is absent, so a
      # missing tool reads as a pass. Print what this shard actually has
      # before anything runs, and fail here rather than silently cover
      # less than the job claims to.
      #
      # Two entries are not plain binaries. `docker` is probed as a
      # daemon — the client is on every runner whether or not anything
      # is listening, and the pgx contract test needs the daemon.
      # `browser` is probed as any of the three names the web suite's
      # own resolver accepts, because its Chromium render case is an
      # `it.skipIf` and would otherwise vanish without a trace.
      - name: Verify the toolchains this shard probes for
        run: |
          set -euo pipefail
          for tool in node ${{ matrix.shard.tools }}; do
            case "$tool" in
              docker)
                docker info >/dev/null 2>&1 || { echo "::error::no Docker daemon"; exit 1; }
                echo "docker   daemon available"
                continue
                ;;
              browser)
                for name in chromium chromium-browser google-chrome; do
                  if command -v "$name" >/dev/null; then
                    printf '%-8s %s\n' browser "$(command -v "$name")"
                    continue 2
                  fi
                done
                for root in "${PLAYWRIGHT_BROWSERS_PATH:-}" /opt/pw-browsers; do
                  [ -n "$root" ] || continue
                  for candidate in "$root"/*/chrome-linux/chrome; do
                    if [ -x "$candidate" ]; then
                      printf '%-8s %s\n' browser "$candidate"
                      continue 4
                    fi
                  done
                done
                echo "::error::no browser found on PATH or under PLAYWRIGHT_BROWSERS_PATH"
                exit 1
                ;;
            esac
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
            printf '%-8s %s\n' "$tool" "$(command -v "$tool")"
          done
          case "${{ matrix.shard.id }}" in
            jvm-*)
              echo "JAVA_HOME=${JAVA_HOME:-unset}"
              "${JAVA_HOME}/bin/javac" -version
              gradle --version | sed -n '/^Gradle/p'
              case " ${{ matrix.shard.tools }} " in *' mvn '*) mvn --version | head -1 ;; esac
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: End-to-end tests
        run: pnpm exec vitest run ${{ matrix.shard.files }}
