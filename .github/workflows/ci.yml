name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The other half of the suite. `verify` runs the whole of `vitest run`,
  # but tests/e2e/ self-skips on CI unless KEEL_RUN_E2E=1 — those suites
  # scaffold a real project, build it with its own wrapper, boot it and
  # drive it over the wire, so they need every toolchain keel emits for
  # and take tens of minutes. Splitting them off keeps the fast gate fast
  # while still running them on every PR; between the two jobs, nothing
  # in the suite is skipped for want of a tool.
  #
  # Sharded by toolchain, one job per stack family. Two reasons, and
  # neither is wall clock alone:
  #
  #   - A shard installs only what its suites probe for. The Go, Rust
  #     and web shards skip the JDK + Gradle + Maven provisioning
  #     entirely, which is the slowest setup here.
  #   - A red X reads `e2e (go)` instead of `e2e`, and re-running one
  #     stack does not re-run the JVM builds.
  #
  # The JVM is then sharded again, along the grid its suites populate,
  # and the two typologies are shaped differently because their volumes
  # are. `basic` is twelve files and stays split by framework, four
  # apiece — CLI and REST × Java and Kotlin — so a red X names the
  # container whose wiring broke and the failing test inside it names
  # the language and the shape. `modulith` is twenty-five and splits by
  # framework × **language**, four apiece (six on Quarkus, which also
  # carries the two non-cell variants).
  #
  # Language is a legal axis here for the first time, and it is the
  # grid rather than an argument that made it one: a shard that runs
  # nothing is worse than no shard, because the check name asserts
  # coverage that does not exist — and until the modulith's Kotlin
  # cells were populated, `jvm-modulith-*-kotlin` would have been
  # exactly that. It is not an axis on the `basic` half, because there
  # a language split buys attribution and no wall clock: those shards
  # already sit near their longest-file floor, and each extra shard
  # costs a fresh JDK + Gradle provisioning.
  #
  # The `files` list is the shard's whole definition, and it is load
  # bearing: a suite in no shard never runs, which looks exactly like a
  # suite that passed. `tests/ci-workflow.test.ts` parses this file and
  # fails in `verify` when tests/e2e/ and these lists disagree — that
  # test is the only thing standing between a new suite and silent
  # non-coverage, so do not delete it when editing the matrix.
  #
  # Vitest parallelises across files but runs the tests inside one file
  # in sequence, so the slowest single *file* is a shard's floor.
  # Concurrent JVM builds on a runner do not scale with the core count
  # either, since each Gradle build is itself parallel and they
  # contend. Re-measure before rebalancing, and measure on the shard
  # shape actually shipped — a file timed against many neighbours
  # reads far slower than the same file timed against two.
  #
  # Splitting the modulith files out of one job was worth several times
  # over what attribution alone would buy. The floor is why it stops
  # here rather than going finer: the smallest of these shards is
  # already bound by its own longest file, so halving it again would
  # buy attribution and nothing else.
  #
  # `keel add module` then populates that same 24-cell grid a second
  # time, and there the split goes all the way down: one cell, one
  # file, one shard. Typology earns its place on this axis — it picks
  # the assembly the wiring class renders into and the build file the
  # new dependencies anchor in, and on Spring it moves `@ComponentScan`
  # between `Main` and `Application` — so a cell is a real
  # intersection rather than a duplicate of its row. The failure these
  # shards exist to name is the silent one: a container that never
  # discovered a handler compiles clean and starts clean, and the only
  # thing that catches it is a build of that exact framework, in that
  # exact language, in that exact assembly. A red X reading
  # `e2e (jvm-add-module-spring-cli-kotlin-maven)` is the diagnosis;
  # the same failure inside a 24-file shard is a log to go read.
  #
  # The cost is real and it is runner minutes, not wall clock: each of
  # these shards pays its own JDK + Gradle provisioning and its own
  # cold dependency resolve, where two files in one shard paid once.
  # They run in parallel, so the job's wall clock is one build. To
  # collapse it, merge the `files` lists by framework × language the
  # way the modulith half is grouped — the suites need no change.
  e2e:
    name: e2e (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEEL_RUN_E2E: '1'

    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: jvm-basic-quarkus
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton.test.ts
              tests/e2e/walking-skeleton-quarkus-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-rest.test.ts
              tests/e2e/walking-skeleton-kotlin.test.ts
              tests/e2e/code-style-jvm.test.ts
          - id: jvm-basic-spring
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton-spring-cli.test.ts
              tests/e2e/walking-skeleton-spring-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-spring.test.ts
              tests/e2e/walking-skeleton-spring-kotlin.test.ts
          - id: jvm-basic-micronaut
            tools: java javac gradle
            files: >-
              tests/e2e/walking-skeleton-micronaut-cli.test.ts
              tests/e2e/walking-skeleton-micronaut-cli-kotlin.test.ts
              tests/e2e/walking-skeleton-micronaut.test.ts
              tests/e2e/walking-skeleton-micronaut-kotlin.test.ts
          - id: jvm-modulith-quarkus-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-quarkus-rest-gradle.test.ts
              tests/e2e/modulith-quarkus-rest-maven.test.ts
              tests/e2e/modulith-quarkus-cli-gradle.test.ts
              tests/e2e/modulith-quarkus-cli-maven.test.ts
              tests/e2e/modulith-baseline.test.ts
              tests/e2e/modulith-persistence.test.ts
          # The engine dial's cell: `modulith-persistence` with the
          # sticky engine answer preset to mariadb. A shard of its own
          # rather than a seventh file above — that shard is the
          # matrix floor, so co-locating another persistence build
          # would raise the whole e2e phase's wall, where one more
          # parallel shard raises nothing.
          - id: jvm-persistence-mariadb
            tools: java javac gradle
            files: >-
              tests/e2e/modulith-persistence-mariadb.test.ts
          - id: jvm-add-module-quarkus-rest-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-quarkus-rest-gradle.test.ts
          - id: jvm-add-module-quarkus-rest-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-quarkus-rest-maven.test.ts
          - id: jvm-add-module-quarkus-rest-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-quarkus-rest-kotlin-gradle.test.ts
          - id: jvm-add-module-quarkus-rest-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-quarkus-rest-kotlin-maven.test.ts
          - id: jvm-add-module-quarkus-cli-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-quarkus-cli-gradle.test.ts
          - id: jvm-add-module-quarkus-cli-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-quarkus-cli-maven.test.ts
          - id: jvm-add-module-quarkus-cli-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-quarkus-cli-kotlin-gradle.test.ts
          - id: jvm-add-module-quarkus-cli-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-quarkus-cli-kotlin-maven.test.ts
          - id: jvm-add-module-spring-rest-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-spring-rest-gradle.test.ts
          - id: jvm-add-module-spring-rest-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-spring-rest-maven.test.ts
          - id: jvm-add-module-spring-rest-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-spring-rest-kotlin-gradle.test.ts
          - id: jvm-add-module-spring-rest-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-spring-rest-kotlin-maven.test.ts
          - id: jvm-add-module-spring-cli-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-spring-cli-gradle.test.ts
          - id: jvm-add-module-spring-cli-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-spring-cli-maven.test.ts
          - id: jvm-add-module-spring-cli-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-spring-cli-kotlin-gradle.test.ts
          - id: jvm-add-module-spring-cli-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-spring-cli-kotlin-maven.test.ts
          - id: jvm-add-module-micronaut-rest-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-micronaut-rest-gradle.test.ts
          - id: jvm-add-module-micronaut-rest-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-micronaut-rest-maven.test.ts
          - id: jvm-add-module-micronaut-rest-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-micronaut-rest-kotlin-gradle.test.ts
          - id: jvm-add-module-micronaut-rest-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-micronaut-rest-kotlin-maven.test.ts
          - id: jvm-add-module-micronaut-cli-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-micronaut-cli-gradle.test.ts
          - id: jvm-add-module-micronaut-cli-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-micronaut-cli-maven.test.ts
          - id: jvm-add-module-micronaut-cli-kotlin-gradle
            tools: java javac gradle
            files: >-
              tests/e2e/add-module-micronaut-cli-kotlin-gradle.test.ts
          - id: jvm-add-module-micronaut-cli-kotlin-maven
            tools: java javac gradle mvn
            files: >-
              tests/e2e/add-module-micronaut-cli-kotlin-maven.test.ts
          - id: jvm-modulith-quarkus-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-quarkus-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-quarkus-rest-kotlin-maven.test.ts
              tests/e2e/modulith-quarkus-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-quarkus-cli-kotlin-maven.test.ts
          - id: jvm-modulith-spring-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-spring-rest-gradle.test.ts
              tests/e2e/modulith-spring-rest-maven.test.ts
              tests/e2e/modulith-spring-cli-gradle.test.ts
              tests/e2e/modulith-spring-cli-maven.test.ts
          - id: jvm-modulith-spring-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-spring-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-spring-rest-kotlin-maven.test.ts
              tests/e2e/modulith-spring-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-spring-cli-kotlin-maven.test.ts
          - id: jvm-modulith-micronaut-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-micronaut-rest-gradle.test.ts
              tests/e2e/modulith-micronaut-rest-maven.test.ts
              tests/e2e/modulith-micronaut-cli-gradle.test.ts
              tests/e2e/modulith-micronaut-cli-maven.test.ts
          - id: jvm-modulith-micronaut-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/modulith-micronaut-rest-kotlin-gradle.test.ts
              tests/e2e/modulith-micronaut-rest-kotlin-maven.test.ts
              tests/e2e/modulith-micronaut-cli-kotlin-gradle.test.ts
              tests/e2e/modulith-micronaut-cli-kotlin-maven.test.ts
          # The composed-entrypoint grid: the stacks whose tag set
          # carries both `arch.cli` and `arch.server-http`, so one
          # hexagon ships two deployment units. Eighteen files, six
          # shards, and both numbers are choices worth stating.
          #
          # **Eighteen files.** The `modulith` half is exhausted — 6
          # combo stacks × 2 build systems = 12 — because that is what
          # issue #108 is about and no build had ever compiled one.
          # The `basic` half is sampled at one build per stack (6),
          # the build system alternating so both appear against each
          # framework and each language: PR #110 built all twelve of
          # those by hand before shipping, so what was missing there
          # was a standing check rather than a first look, and the
          # twelve modulith cells re-exercise the shared seed builders
          # in `jvm-shared-root.ts` on every run anyway.
          #
          # **Six shards, not eighteen.** This follows the
          # `jvm-modulith-*` convention (framework × language), not the
          # `jvm-add-module-*` one (a job per cell). The add-module
          # grid earned a job per cell because its cells are cheap
          # enough to finish comfortably inside the matrix floor, so
          # attribution was free. These cells build *two* assemblies
          # apiece, so they cost more; grouped three to a shard they
          # still finish inside that floor and cost the phase no wall
          # clock, where eighteen would pay eighteen cold JDK+Gradle
          # provisions for a red X that framework × language already
          # names precisely enough.
          #
          # Within a shard the two Gradle cells are effectively tied
          # and the Maven one is roughly half either, so no single
          # file is the floor here and peeling one out would buy
          # nothing. `mvn` is in every shard because every shard
          # carries at least one Maven cell.
          - id: jvm-combo-quarkus-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-quarkus-cli-rest-gradle.test.ts
              tests/e2e/combo-modulith-quarkus-cli-rest-maven.test.ts
              tests/e2e/combo-basic-quarkus-cli-rest-gradle.test.ts
          - id: jvm-combo-quarkus-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-quarkus-cli-rest-kotlin-gradle.test.ts
              tests/e2e/combo-modulith-quarkus-cli-rest-kotlin-maven.test.ts
              tests/e2e/combo-basic-quarkus-cli-rest-kotlin-maven.test.ts
          - id: jvm-combo-spring-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-spring-cli-rest-gradle.test.ts
              tests/e2e/combo-modulith-spring-cli-rest-maven.test.ts
              tests/e2e/combo-basic-spring-cli-rest-maven.test.ts
          - id: jvm-combo-spring-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-spring-cli-rest-kotlin-gradle.test.ts
              tests/e2e/combo-modulith-spring-cli-rest-kotlin-maven.test.ts
              tests/e2e/combo-basic-spring-cli-rest-kotlin-gradle.test.ts
          - id: jvm-combo-micronaut-java
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-micronaut-cli-rest-gradle.test.ts
              tests/e2e/combo-modulith-micronaut-cli-rest-maven.test.ts
              tests/e2e/combo-basic-micronaut-cli-rest-gradle.test.ts
          - id: jvm-combo-micronaut-kotlin
            tools: java javac gradle mvn
            files: >-
              tests/e2e/combo-modulith-micronaut-cli-rest-kotlin-gradle.test.ts
              tests/e2e/combo-modulith-micronaut-cli-rest-kotlin-maven.test.ts
              tests/e2e/combo-basic-micronaut-cli-rest-kotlin-maven.test.ts
          # Six files where there were two, and the shape came from
          # a measurement that twice contradicted the obvious answer.
          #
          # When the modulith cells first landed, `modulith-go-http`
          # alone *was* the job: it held two long cases in sequence,
          # so the standing convention applied — a long case gets its
          # own file. Splitting it made the job **slower**. Cause:
          # each suite took a fresh GOCACHE/GOPATH in its own
          # `beforeAll`, so a file peeled off the end paid a cold
          # stdlib-and-dependencies compile it used to inherit warm.
          # Splitting a file bought a second cold compile and sold
          # nothing.
          #
          # The fix was the cache, not the file layout:
          # `sharedGoHome()` gives every suite in a run one
          # content-addressed cache, so the cold compile happens once
          # per run instead of once per file. The shipped shape is
          # comfortably faster than either earlier one.
          #
          # Still one shard, and now for a reason it did not have
          # before: the floor is `fullstack-go`, a file none of this
          # work added, so splitting further would buy attribution and
          # no wall clock. `docker` remains for `fullstack-go` alone.
          # `modulith-go-persistence-liquibase` rides here rather than
          # in a shard of its own: it is the persistence cell's shape
          # again with a different migrations/ unit, and a parallel
          # file under the floor costs nothing, where a new shard
          # would need the exact-match `Setup Go` condition widened to
          # earn the same.
          - id: go
            tools: go docker
            files: >-
              tests/e2e/walking-skeleton-go.test.ts
              tests/e2e/modulith-go-cli.test.ts
              tests/e2e/modulith-go-http.test.ts
              tests/e2e/modulith-go-persistence.test.ts
              tests/e2e/modulith-go-persistence-liquibase.test.ts
              tests/e2e/modulith-go-peer-context.test.ts
              tests/e2e/add-module-go.test.ts
              tests/e2e/fullstack-go.test.ts
          # Six files, one shard — and unlike every earlier revision
          # of this comment, that is now a choice with a cost rather
          # than a free one.
          #
          # The old shape was floor-bound by files that all paid the
          # same cold axum compile, which is why splitting bought
          # attribution and nothing else. `modulith-rust-persistence`
          # pays a cold `postgres` compile on top of that one and is
          # comfortably the slowest file here, so peeling it out would
          # cut real wall clock rather than relabel it.
          #
          # How much, nobody has measured, and the honest bound
          # matters: that file's cost is a *contended* one — it shares
          # the runner's cores with five others for much of its life,
          # and run alone it would be faster, so a split lands this
          # job well short of what "max of the two halves" suggests.
          # Kept as one shard until someone measures the uncontended
          # cost instead of estimating it; that is the one thing the
          # decision still turns on.
          #
          # `tools:` stays `cargo`, and the persistence cell is why
          # that is worth stating: its contract test wants a Postgres
          # through Testcontainers and gets none here. The emitted test
          # probes for a daemon and returns early, so `cargo test`
          # still compiles every crate — which is what the cell exists
          # to prove — and skips one case. Adding `docker` here would
          # buy that one assertion and a container pull per run. The
          # JVM's `modulith-persistence` makes the same trade in a
          # shard with no `docker` either.
          - id: rust
            tools: cargo
            files: >-
              tests/e2e/walking-skeleton-rust.test.ts
              tests/e2e/fullstack-rust.test.ts
              tests/e2e/modulith-rust-cli.test.ts
              tests/e2e/modulith-rust-http.test.ts
              tests/e2e/modulith-rust-peer-context.test.ts
              tests/e2e/modulith-rust-persistence.test.ts
              tests/e2e/add-module-rust.test.ts
          # Nine files where there were three. The modulith halves of
          # the two TypeScript stacks used to ride inside their
          # `walking-skeleton-*` files; they are cells, so they are
          # files now, and `modulith-web-components-pnpm` is a cell
          # that had never been built at all.
          #
          # One shard, because its longest file leaves headroom
          # against the job's wall rather than pinning it — unlike the
          # `go` shard above, which was pinned, and which got a file
          # split rather than a shard split for it. Peeling the
          # modulith cases out of `wc-walking-skeleton` lowered this
          # shard's floor rather than raising it. `browser` stays in
          # `tools:` because four suites render. Measure this one on
          # the runner rather than a laptop: a laptop reads
          # optimistically here, and the floor has already changed
          # hands once between files.
          #
          # The three `ts-cli` suites (basic + two modulith cells)
          # ride here too: they run inside the existing floor, and
          # they render nothing, so the shard's shape and tools are
          # unchanged.
          #
          # `ui-stack-finder` is the fourth renderer, and one of two
          # suites here that scaffold nothing: it spawns `keel ui` and
          # drives the page with Playwright. It belongs in this shard
          # rather than one of its own precisely because `browser` is
          # already declared here, and it finishes inside this shard's
          # floor rather than becoming it. It reads optimistically on a
          # laptop — its `beforeAll` compiles `dist/` and launches a
          # browser, and both cost more on a runner — so measure it
          # there, as the note above says.
          #
          # `ui-plugin-stack` is the other, and it is a separate file
          # rather than three more cases in the one above for a reason
          # that is not length: the two differ by *what is on disk when
          # the page opens*, so each needs its own cwd and its own
          # `keel ui`. Two `beforeAll`s in one file would spawn both
          # servers for either suite's cases. It is the shorter of the
          # two, so it does not move this shard's floor; both share
          # their harness (`tests/support/ui-e2e.ts`) rather than two
          # copies of the spawn-and-settle logic drifting apart. A
          # third joined them, `ui-refusal`: it seeds its project
          # in-process with every deferred action faked, so it installs
          # nothing and probes for nothing this shard does not already
          # have. Measured level with `ui-plugin-stack`, and both well
          # under `ui-stack-finder`, which floors the three.
          - id: web
            tools: npm pnpm browser
            files: >-
              tests/e2e/ts-walking-skeleton.test.ts
              tests/e2e/ts-cli-walking-skeleton.test.ts
              tests/e2e/modulith-ts-http-npm.test.ts
              tests/e2e/modulith-ts-http-pnpm.test.ts
              tests/e2e/modulith-ts-cli-npm.test.ts
              tests/e2e/modulith-ts-cli-pnpm.test.ts
              tests/e2e/modulith-ts-peer-context.test.ts
              tests/e2e/wc-walking-skeleton.test.ts
              tests/e2e/modulith-web-components-npm.test.ts
              tests/e2e/modulith-web-components-pnpm.test.ts
              tests/e2e/modulith-wc-peer-context.test.ts
              tests/e2e/add-module-ts.test.ts
              tests/e2e/add-module-wc.test.ts
              tests/e2e/fullstack.test.ts
              tests/e2e/ui-stack-finder.test.ts
              tests/e2e/ui-plugin-stack.test.ts
              tests/e2e/ui-refusal.test.ts
          # The TypeScript half of the composed-entrypoint grid, in a
          # shard of its own rather than as three more files above.
          # Two reasons, and neither is wall clock inside this job:
          # the `web` shard carries `browser` in `tools:` because
          # four of its suites render in Chromium, and these render
          # nothing — a shard that probes for a browser it never uses
          # is a provisioning cost and a lie about what the suites
          # need. And `web` already carries fifteen files with real
          # headroom to spare; three more real installs would push its
          # wall up, where one more parallel shard pushes the
          # phase's up by nothing — this shard lands an order of
          # magnitude inside the matrix floor. There is no build step
          # to pay for; the install is the cost, and npm's is the best
          # part of twice pnpm's on the same layout.
          - id: web-combo
            tools: npm pnpm
            files: >-
              tests/e2e/combo-modulith-ts-cli-http-npm.test.ts
              tests/e2e/combo-modulith-ts-cli-http-pnpm.test.ts
              tests/e2e/combo-basic-ts-cli-http-pnpm.test.ts
          # The only shard whose suite compiles nothing, and the only
          # one that runs an emitted `dev/compose.yaml`. Every other
          # docker-using suite reaches its database through
          # Testcontainers, which mounts no volume — which is how a dev
          # database that could not start shipped past the whole grid.
          #
          # `docker` alone: every deferred action is faked, so the
          # scaffold needs no JDK even though it is the stack that
          # reported the bug. One image pull and a first-boot initdb
          # puts this shard an order of magnitude under the
          # `jvm-modulith-quarkus-java` floor, so it costs the e2e
          # phase no wall clock.
          - id: dev-compose
            tools: docker
            files: >-
              tests/e2e/dev-compose.test.ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      # JDK 25 because the emitted JVM projects target release 25 and
      # Maven compiles with whatever JDK runs it — on anything older the
      # Maven suites skip themselves rather than fail. Gradle would not
      # care (its foojay resolver provisions a toolchain), which is why
      # this is the JDK the *Maven* half dictates.
      #
      # Every `jvm-*` shard gets it, not only the one holding the Maven
      # suite: the prefix is the whole condition, so a new JVM shard is
      # provisioned by being named, and one that is not named simply
      # skips every suite it was given.
      - name: Setup JDK 25
        if: startsWith(matrix.shard.id, 'jvm')
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      # …and that JDK is exactly why the host Gradle has to be pinned.
      # `gradle wrapper` is the only thing it runs (the wrapper it writes
      # is 9.7.0 and provisions its own toolchain), but Gradle 8.x cannot
      # start on JDK 25 — it fails with the version string as the whole
      # error message. Pinning the host to the same 9.7.0 keeps one JDK
      # serving both build systems.
      - name: Setup Gradle 9.7.0
        if: startsWith(matrix.shard.id, 'jvm')
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.0'

      # `stable`, not the `go 1.24` the emitted go.mod declares — that
      # directive does not survive first contact. The OpenTelemetry
      # modules the observability vertical pulls in require Go >= 1.25,
      # so the bootstrap's own `go mod tidy` rewrites the line to
      # `go 1.25.0`. On a developer's machine that is invisible
      # (GOTOOLCHAIN defaults to `auto` and Go fetches the newer
      # toolchain); setup-go pins GOTOOLCHAIN=local, so a runner on 1.24
      # cannot upgrade and the scaffold fails outright.
      - name: Setup Go
        if: matrix.shard.id == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Every suite skips itself when its toolchain is absent, so a
      # missing tool reads as a pass. Print what this shard actually has
      # before anything runs, and fail here rather than silently cover
      # less than the job claims to.
      #
      # Two entries are not plain binaries. `docker` is probed as a
      # daemon — the client is on every runner whether or not anything
      # is listening, and the pgx contract test needs the daemon.
      # `browser` is probed as any of the three names the web suite's
      # own resolver accepts, because its Chromium render case is an
      # `it.skipIf` and would otherwise vanish without a trace.
      - name: Verify the toolchains this shard probes for
        run: |
          set -euo pipefail
          for tool in node ${{ matrix.shard.tools }}; do
            case "$tool" in
              docker)
                docker info >/dev/null 2>&1 || { echo "::error::no Docker daemon"; exit 1; }
                echo "docker   daemon available"
                continue
                ;;
              browser)
                for name in chromium chromium-browser google-chrome; do
                  if command -v "$name" >/dev/null; then
                    printf '%-8s %s\n' browser "$(command -v "$name")"
                    continue 2
                  fi
                done
                for root in "${PLAYWRIGHT_BROWSERS_PATH:-}" /opt/pw-browsers; do
                  [ -n "$root" ] || continue
                  for candidate in "$root"/*/chrome-linux/chrome; do
                    if [ -x "$candidate" ]; then
                      printf '%-8s %s\n' browser "$candidate"
                      continue 4
                    fi
                  done
                done
                echo "::error::no browser found on PATH or under PLAYWRIGHT_BROWSERS_PATH"
                exit 1
                ;;
            esac
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
            printf '%-8s %s\n' "$tool" "$(command -v "$tool")"
          done
          case "${{ matrix.shard.id }}" in
            jvm-*)
              echo "JAVA_HOME=${JAVA_HOME:-unset}"
              "${JAVA_HOME}/bin/javac" -version
              gradle --version | sed -n '/^Gradle/p'
              # `mvn` on PATH is only half of what the Maven suites
              # need. `skipJvmMavenE2E` also gates on the JDK behind
              # JAVA_HOME, because Maven compiles with whatever runs it
              # and the emitted projects target release 25 — Gradle is
              # exempt, its foojay resolver provisions a toolchain of
              # its own. Printing the version leaves that gate
              # unchecked: on an older JAVA_HOME every Maven suite
              # skips itself and the shard reports the same green it
              # would have reported anyway. On a shard whose files are
              # all Maven, that green covers nothing at all.
              case " ${{ matrix.shard.tools }} " in
                *' mvn '*)
                  mvn --version | head -1
                  major=$("${JAVA_HOME}/bin/javac" -version 2>&1 | sed -n 's/^javac \([0-9]*\).*/\1/p')
                  if [ "${major:-0}" -lt 25 ]; then
                    echo "::error::JAVA_HOME is JDK ${major:-unknown}; the Maven suites need 25+ and would skip themselves"
                    exit 1
                  fi
                  ;;
              esac
              ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: End-to-end tests
        run: pnpm exec vitest run ${{ matrix.shard.files }}
