name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The other half of the suite. `verify` runs the whole of `vitest run`,
  # but tests/e2e/ self-skips on CI unless KEEL_RUN_E2E=1 — those suites
  # scaffold a real project, build it with its own wrapper, boot it and
  # drive it over the wire, so they need every toolchain keel emits for
  # and take tens of minutes. Splitting them off keeps the fast gate fast
  # while still running them on every PR; between the two jobs, nothing
  # in the suite is skipped for want of a tool.
  e2e:
    name: e2e (real toolchains)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEEL_RUN_E2E: '1'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      # JDK 25 because the emitted JVM projects target release 25 and
      # Maven compiles with whatever JDK runs it — on anything older the
      # Maven suites skip themselves rather than fail. Gradle would not
      # care (its foojay resolver provisions a toolchain), which is why
      # this is the JDK the *Maven* half dictates.
      - name: Setup JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # …and that JDK is exactly why the host Gradle has to be pinned.
      # `gradle wrapper` is the only thing it runs (the wrapper it writes
      # is 9.4.1 and provisions its own toolchain), but Gradle 8.x cannot
      # start on JDK 25 — it fails with the version string as the whole
      # error message. Pinning the host to the same 9.4.1 keeps one JDK
      # serving both build systems.
      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          gradle-version: '9.4.1'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false

      # Every suite skips itself when its toolchain is absent, so a
      # missing tool reads as a pass. Print what the runner actually has
      # before anything runs, and fail here rather than silently cover
      # less than the job claims to.
      - name: Verify the toolchains the suites probe for
        run: |
          set -euo pipefail
          for tool in java javac gradle mvn go cargo node npm pnpm; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
            printf '%-8s %s\n' "$tool" "$(command -v "$tool")"
          done
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          "${JAVA_HOME}/bin/javac" -version
          gradle --version | sed -n '/^Gradle/p'
          mvn --version | head -1
          go version
          cargo --version
          # Testcontainers-backed suites skip without a daemon; the
          # runner has one, and this says so out loud when it does not.
          docker info >/dev/null 2>&1 && echo "docker: available" || echo "::warning::no Docker daemon — Testcontainers suites will skip"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: End-to-end tests
        run: pnpm test:e2e
